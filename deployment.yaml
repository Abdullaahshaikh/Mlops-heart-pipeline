apiVersion: apps/v1
kind: Deployment
metadata:
  name: heart-mlops-deployment
spec:
  replicas: 1
  selector:
    matchLabels:
      app: heart-mlops
  template:
    metadata:
      labels:
        app: heart-mlops
    spec:
      containers:
        - name: heart-mlops-container
          image: heart-mlops:latest
          imagePullPolicy: IfNotPresent # ✅ CHANGE HERE
          ports:
            - containerPort: 5000
